<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mike's Solitaire</title>
<link rel="stylesheet" href="style.css">

<link rel="icon" href="favicon.png" sizes="48x48">
<link rel="icon" href="icons/icon-192x192.png" type="image/png" sizes="192x192">
<link rel="icon" href="icons/icon-512x512.png" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="icons/icon-180x180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b5d3b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mike's Solitaire">
</head>
<body>
  <div id="update-bar" class="hidden">
    <span>A new version of Mike's Solitaire is available.</span>
    <button id="updateReloadBtn">Reload</button>
    <button id="updateDismissBtn" aria-label="Dismiss">&times;</button>
  </div>

  <header id="topbar">
    <h1>Mike's Solitaire</h1>
    <div class="stats">
      <span id="moves">Moves: 0</span>
      <span id="timer">Time: 0:00</span>
    </div>
    <div class="controls">
      <!-- Undo/Hint icons: Lucide (ISC license), undo-2 and lightbulb - the
           same two icons used for these actions in the Sudoku app. -->
      <button id="undoBtn" class="icon-button" aria-label="Undo" title="Undo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 14 4 9l5-5" />
          <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11" />
        </svg>
      </button>
      <button id="hintBtn" class="icon-button" aria-label="Hint" title="Hint">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5" />
          <path d="M9 18h6" />
          <path d="M10 22h4" />
        </svg>
      </button>
      <!-- fast-forward icon: Lucide (ISC license), same icon set as Undo/
           Hint above. Label lives in its own span - script.js swaps its
           text between "Auto Finish"/"Stop" without touching the icon. -->
      <button id="autoFinishBtn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 19 22 12 13 5 13 19" />
          <polygon points="2 19 11 12 2 5 2 19" />
        </svg>
        <span id="autoFinishBtnLabel">Auto Finish</span>
      </button>
      <button id="newGameBtn">New Game</button>
      <button id="restartBtn">Restart</button>
      <button id="settingsBtn" class="icon-button" aria-label="Settings">&#9881;</button>
    </div>
  </header>

  <div id="hint-message" class="hidden" role="status" aria-live="polite"></div>

  <main id="board">
    <div id="top-row">
      <div id="top-row-watermark" aria-hidden="true"></div>
      <div id="stock-waste">
        <div class="pile" id="stock" data-pile="stock"></div>
        <div class="pile" id="waste" data-pile="waste"></div>
      </div>
      <div id="foundations">
        <div class="pile foundation" id="foundation-0" data-pile="foundation" data-index="0"></div>
        <div class="pile foundation" id="foundation-1" data-pile="foundation" data-index="1"></div>
        <div class="pile foundation" id="foundation-2" data-pile="foundation" data-index="2"></div>
        <div class="pile foundation" id="foundation-3" data-pile="foundation" data-index="3"></div>
      </div>
    </div>

    <div id="tableau">
      <div class="pile column" id="tableau-0" data-pile="tableau" data-index="0"></div>
      <div class="pile column" id="tableau-1" data-pile="tableau" data-index="1"></div>
      <div class="pile column" id="tableau-2" data-pile="tableau" data-index="2"></div>
      <div class="pile column" id="tableau-3" data-pile="tableau" data-index="3"></div>
      <div class="pile column" id="tableau-4" data-pile="tableau" data-index="4"></div>
      <div class="pile column" id="tableau-5" data-pile="tableau" data-index="5"></div>
      <div class="pile column" id="tableau-6" data-pile="tableau" data-index="6"></div>
    </div>
  </main>

  <div id="settings-overlay" class="hidden">
    <div id="settings-card">
      <div id="settings-header">
        <h2>Settings</h2>
        <button id="settingsCloseBtn" aria-label="Close">&times;</button>
      </div>
      <div id="settings-sections"></div>
      <div id="settings-secondary">
        <!-- Opens #stats-overlay (hides this panel, shows that one - see
             script.js). Plain in-app navigation, so a "›" rather than
             Feedback's external-link arrow below. -->
        <button type="button" id="statsLink" class="settings-feedback-link" aria-label="View your stats">
          <span class="settings-feedback-link-label">Stats</span>
          <span class="settings-feedback-link-arrow" aria-hidden="true">&#8250;</span>
        </button>
        <!-- Message-square icon: Lucide (ISC license), same icon set as
             Undo/Hint above. A plain external link (not a JS click handler)
             so opening it can never touch this page's own game state - the
             browser handles target="_blank" entirely on its own. -->
        <a id="feedbackLink" class="settings-feedback-link" href="https://docs.google.com/forms/d/e/1FAIpQLSeoGpjkiNNTupsJzx13C9tAeDU6277djkto8vvxjKY55C84KA/viewform?usp=publish-editor" target="_blank" rel="noopener noreferrer" aria-label="Open feedback form">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
          </svg>
          <span class="settings-feedback-link-label">Feedback</span>
          <span class="settings-feedback-link-arrow" aria-hidden="true">&#8599;</span>
        </a>
      </div>
      <!-- Plain-looking version text, not styled as a button - clicking it
           instantly completes the current board and plays the win
           celebration, for previewing it without actually finishing a deal.
           Text content/version number is set from script.js. -->
      <button type="button" id="versionLink" class="settings-version" aria-label="Version"></button>
    </div>
  </div>

  <!-- One level "into" Settings, not a separate top-level overlay - opening
       it hides #settings-overlay and shows this instead; its own close
       button reverses that (see script.js). Reuses #settings-card's exact
       visual shell (same id intentionally NOT reused, since both need to
       exist in the DOM at once - see style.css's shared #settings-card,
       #stats-card rule). -->
  <div id="stats-overlay" class="hidden">
    <div id="stats-card">
      <div id="settings-header">
        <h2>Your Stats</h2>
        <button id="statsCloseBtn" aria-label="Back to Settings">&times;</button>
      </div>
      <div id="stats-mode-toggle">
        <button type="button" id="statsDraw1Btn" class="settings-option settings-option--stack">Draw 1</button>
        <button type="button" id="statsDraw3Btn" class="settings-option settings-option--stack">Draw 3</button>
      </div>
      <div id="stats-rows"></div>
    </div>
  </div>

  <!-- No scrim, no boxed card - once the celebration's cards have cleared,
       this appears directly on the visible green felt. Entrance class is
       applied by script.js (one of a few random, subtle treatments).
       Hierarchy (see script.js's showVictoryMessage): a small celebratory
       emoji (from victory.js's pickHeadline(), the seam for future
       alternates), the win number in the current draw mode (largest),
       this game's result, then 0 or 2 record lines - each independently
       either an ordinary "Fastest:"/"Fewest moves:" readout or a trophy
       line if this win just broke that record. Never both for the same
       record on the same line. -->
  <div id="win-message" class="hidden">
    <div id="winEmoji" aria-hidden="true"></div>
    <h1 id="winHeadline"></h1>
    <p id="winResultLine"></p>
    <div id="winRecords">
      <p id="winRecordTime"></p>
      <p id="winRecordMoves"></p>
    </div>
    <button id="winNewGameBtn">New Game</button>
  </div>

  <div id="confirm-overlay" class="hidden">
    <div id="confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message">
      <h2 id="confirm-title"></h2>
      <p id="confirm-message"></p>
      <div id="confirm-actions">
        <button id="confirmGiveUpBtn">Give Up</button>
        <button id="confirmKeepBtn">Keep Playing</button>
      </div>
    </div>
  </div>

  <div id="drag-layer"></div>
  <!-- Win-celebration clone cards only ever live here - never in #drag-layer,
       so the two systems can't collide in z-index or cleanup ordering. -->
  <div id="celebration-layer"></div>

  <script type="module" src="script.js"></script>
</body>
</html>
