[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Card art is fetched through cache-busted URLs (?v=... in script.js's
# ASSET_VERSION), so it's safe to cache for a year and never revalidate -
# a future art change mints a new URL rather than relying on this cache
# ever expiring. Scoped to just the versioned WebP directories, never the
# untiered PNG fallbacks living alongside them (those aren't versioned and
# need to keep revalidating normally), and not index.html/script.js/
# style.css, which aren't versioned either.
[[headers]]
  for = "/assets/cards/backs/hi/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/cards/backs/lo/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Runtime card-face compositing (see card-face-compositor.js): Regular,
# Simple and XL faces now composite from these source layers at render
# time instead of loading a separately pre-baked file per design x
# condition x card, so it's these folders that need the same cache
# treatment the old per-card art above had - same reasoning, same
# ?v=ASSET_VERSION cache-busting convention, just scoped to fewer, shared
# files (6 dirty backgrounds + 1 white background + 52 transparent faces
# per design, instead of a whole tiered clean+worn tree per design).
[[headers]]
  for = "/assets/cards/DIRTYS/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/cards/WHITE.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/cards/SIMPLE TX/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/cards/STANDARD TX/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/cards/XL TX/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
